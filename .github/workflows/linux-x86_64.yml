name: Build Linux x86_64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-x86_64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file libssl-dev patchelf rpm \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Python tests
        run: python -m pytest -q

      - name: Install frontend dependencies and build
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Check Rust sources
        working-directory: desktop/src-tauri
        run: cargo check --locked

      - name: Build Linux bundles
        run: python build_linux_x64.py

      - name: Smoke test packaged backend
        run: |
          set -euo pipefail
          backend="release/GalTransl_*_linux_x86_64/backend/galtransl_backend"
          backend_bin=$(ls $backend)
          "$backend_bin" --host 127.0.0.1 --port 12333 > /tmp/galtransl-backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:12333/api/version > /tmp/galtransl-version.json; then
              break
            fi
            sleep 0.25
          done
          cat /tmp/galtransl-version.json
          curl -fsS http://127.0.0.1:12333/api/plugins > /tmp/galtransl-plugins.json
          python -c 'import json; data=json.load(open("/tmp/galtransl-plugins.json")); assert len(data["plugins"]) > 0'
          kill "$backend_pid"
          wait "$backend_pid" 2>/dev/null || true
          trap - EXIT

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GalTransl-linux-x86_64
          path: |
            release/*.deb
            release/*.rpm
            release/*.AppImage
            release/*.AppImage.xz
            release/*.tar.gz
          if-no-files-found: error
