Core:
  Name: 通用-全角半角转换
  Type: text
  Module: text_common_full2Half

Documentation:
  Author: PiDanShouRouZhou
  Version: 1.1
  Description: 支持全角字符（数字、大小写字母、标点）与半角字符之间的转换。可自定义替换表，支持自定义替换时机。

Settings: # 这里存放插件的设置
  是否替换标点: False
  替换时机: "before_src_processed" # [before_src_processed/after_src_processed/before_dst_processed/after_dst_processed] 默认为翻译前替换，可自行选择。
  反向替换: False # 设为True时，则反向替换为全角字符
  自定义替换表: {} # 添加自定义替换表，格式为 { "全角字符": "半角字符" }，无论是否反向替换。

# 默认替换表:
# {
#     '。': '.', '，': ',', '、': '\\', '；': ';', '：': ':',
#     '？': '?', '！': '!', '"': '"', '"': '"', ''': "'", ''': "'",
#     '（': '(', '）': ')', '【': '[', '】': ']', '《': '<', '》': '>',
#     '「': '[', '」': ']', '『': '{', '』': '}', '〔': '[', '〕': ']',
#     '｛': '{', '｝': '}', '［': '[', '］': ']',
#     '％': '%', '＋': '+', '－': '-', '＊': '*', '／': '/', '＝': '=',
#     '＜': '<', '＞': '>', '＆': '&', '＄': '$', '＃': '#', '＠': '@',
#     '＾': '^', '｜': '|', '～': '~', '｀': '`',
#     '　': ' ',  # 全角空格到半角空格
#     '…': '...', '—': '-', '－': '-', 'ー': '-',  # 各种横线
#     '・': '·', '·': '·',  # 中点
#     '′': "'", '″': '"',  # 角分符号
#     '〜': '~', '～': '~',  # 波浪线
#     '〇': '0',  # 汉字零
#     '￥': '¥', '￠': '¢', '￡': '£', '€': 'E',  # 货币符号
# }

SettingsSchema:
  是否替换标点:
    label: 同时转换标点
    description: 除数字和英文字母外，也转换默认替换表中的标点。
    advanced: false
  替换时机:
    label: 执行阶段
    description: 选择处理原文还是译文，以及在对应文本处理流程之前或之后执行。
    advanced: false
    options:
    - value: before_src_processed
      label: 原文预处理之前
    - value: after_src_processed
      label: 原文预处理之后
    - value: before_dst_processed
      label: 译文后处理之前
    - value: after_dst_processed
      label: 译文后处理之后
  反向替换:
    label: 半角转全角
    description: 关闭时将全角转为半角，开启时反向转换为全角。
    advanced: false
  自定义替换表:
    label: 自定义字符替换表
    description: 填写 JSON 对象，例如 {"Ａ":"A"}。始终按“全角字符：半角字符”填写；反向转换时自动交换方向。
    advanced: true
