Core:
  Name: Epub 文件
  Type: file
  Module: file_epub_epub
  Extensions: [".epub", ".html", ".xhtml"] # 自动识别文件插件时按扩展名匹配（html/xhtml 是拆分模式解出来的章节）

Documentation:
  Author: PiDanShouRouZhou
  Version: 2.0
  Description: 翻译 Epub 文件，按段落、标题、列表等块级元素提取正文，注音（ruby）不送翻译，只替换正文、保留链接与锚点；支持自动识别名称、双语显示、译前/译后正则、拆分文件以支持单文件多线程翻译。

Settings: # 这里存放插件的设置
  是否自动识别名称: False  # 默认关闭自动识别名称
  名称识别正则表达式: ^(?P<name>.*?)「(?P<message>.*?)」$ # 用于识别名称的正则表达式，两个part分别标识name和message
  名称识别拼接方案: "{name}\n「{message}」" # 用于拼接名称的格式化字符串（f-string），{name}和{message}分别表示name和message
  双语显示: True  # 默认开启双语显示
  原文颜色: "#808080" #默认灰色
  缩小比例: 0.8  # 默认缩小到原始大小的80%
  译前正则: []  # 每条「正则 => 替换」，提取正文前作用于章节 HTML
  译后正则: []  # 每条「正则 => 替换」，写回译文后作用于章节 HTML
  是否拆分文件以支持单文件多线程: False  # 单文件拆分功能，用于支持单文件多线程翻译，默认关闭。

SettingsSchema:
  是否自动识别名称:
    label: 自动识别人名
    description: 从段落中按正则表达式提取说话人和正文。
    advanced: false
  名称识别正则表达式:
    label: 人名识别规则
    description: 正则表达式需包含 name 和 message 两个命名分组，分别匹配人名和正文。
    advanced: true
  名称识别拼接方案:
    label: 人名与正文拼接格式
    description: 将识别后的人名和译文重新拼接；{name} 表示人名，{message} 表示正文。
    advanced: true
    multiline: true
  双语显示:
    label: 双语显示
    description: 在输出电子书中同时显示译文和原文。
    advanced: false
  原文颜色:
    label: 原文颜色
    description: '双语显示时原文的 CSS 颜色，例如 #808080 为灰色。'
    advanced: true
  缩小比例:
    label: 原文字号比例
    description: 双语显示时原文字号相对于正常字号的比例，0.8 表示 80%。
    advanced: true
    min: 0.1
    step: 0.1
  译前正则:
    label: 译前正则
    description: '提取正文前对每个章节的 HTML 依次执行替换，每行一条「正则 => 替换」，例如 <ruby>(.*?)<rt>(.*?)</rt></ruby> => \1(\2) 把注音改成括号留给模型参考；替换串用 Python 语法（\1、\g<name>），省略「 => 替换」表示删除匹配内容。'
    advanced: true
  译后正则:
    label: 译后正则
    description: 写回译文后对每个章节的 HTML 依次执行替换，格式同译前正则，可用于还原译前正则改写的标记。
    advanced: true
  是否拆分文件以支持单文件多线程:
    label: 拆分章节并发翻译
    description: 将 EPUB 拆分为章节以便并发处理，完成后合并为电子书。
    advanced: true
